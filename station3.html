<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거실역</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:'Courier New', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.board{
    width:90%;
    max-width:900px;
}
.header{
    font-size:24px;
    border-bottom:2px solid #333;
    padding-bottom:10px;
    margin-bottom:20px;
}
.row{
    display:flex;
    justify-content:space-between;
    padding:20px 0;
    border-bottom:1px solid #222;
    font-size:32px;
}
.arriving{
    animation: blink 1s infinite;
}
@keyframes blink{
    50% { opacity:0.2; }
}
</style>
</head>
<body>

<div class="board">
<div class="header">1호선 | 거실역</div>

<div class="row">
<div>열차 상태</div>
<div id="status"></div>
</div>

</div>

<script>

// 기본 설정
if (!localStorage.getItem("metroConfig")) {
    localStorage.setItem("metroConfig", JSON.stringify({
        travelTime: 35
    }));
}

function getConfig(){
    return JSON.parse(localStorage.getItem("metroConfig"));
}

const stations = ["거실", "주방", "서재"];
const currentStation = "거실";

function updateBoard(){
    const travel = getConfig().travelTime;
    const totalLoop = travel * stations.length;

    const now = Math.floor(Date.now()/1000);
    const position = now % totalLoop;

    const segment = Math.floor(position / travel);
    const nextStation = stations[segment];
    const timeLeft = travel - (position % travel);

    const el = document.getElementById("status");

    if(nextStation === currentStation){

        if(timeLeft <= 5){
            el.innerText = "곧 도착";
            el.classList.add("arriving");
        }
        else if(timeLeft <= 30){
            el.innerText = "접근 중 (" + timeLeft + "초)";
            el.classList.remove("arriving");
        }
        else{
            el.innerText = timeLeft + "초 후 도착";
            el.classList.remove("arriving");
        }

    } else {
        el.innerText = nextStation + "역 이동 중";
        el.classList.remove("arriving");
    }
}

setInterval(updateBoard,1000);
updateBoard();

</script>

</body>
</html>
