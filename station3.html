<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거실역</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* 상단 바 */
.topbar{
    background:#fff;
    color:#000;
    padding:10px 20px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* 메인 영역 */
.main{
    flex:1;
    display:flex;
    background:#000;
}

/* 왼쪽 숫자 영역 */
.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    border-right:4px solid #222;
}

.minutes{
    font-family:'Orbitron', sans-serif;
    font-size:160px;
    color:#ffcc00;
}

/* 오른쪽 인포 영역 */
.right{
    width:40%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:30px;
}

.info{
    font-size:22px;
    line-height:1.6;
}

.clock{
    text-align:right;
    font-size:26px;
    font-weight:bold;
}

.blink{
    animation: blink 1s infinite;
}

@keyframes blink{
    50% { opacity:0.2; }
}
</style>
</head>
<body>

<div class="container">

<div class="topbar">
<div>Ⓜ 1호선 거실역</div>
<div id="clock"></div>
</div>

<div class="main">

<div class="left">
<div class="minutes" id="minutes">--</div>
</div>

<div class="right">
<div class="info" id="infoText">
정상 운행 중
</div>

<div>
<button onclick="changeInfo()">안내문 변경</button>
</div>
</div>

</div>
</div>

<script>

// ===== 설정 =====
if (!localStorage.getItem("metroConfig")) {
    localStorage.setItem("metroConfig", JSON.stringify({
        travelTime: 35
    }));
}

function getConfig(){
    return JSON.parse(localStorage.getItem("metroConfig"));
}

const stations = ["거실","주방","서재"];
const currentStation = "거실";

// ===== 시간 표시 =====
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

// ===== 열차 계산 =====
function updateBoard(){
    const travel = getConfig().travelTime;
    const totalLoop = travel * stations.length;

    const now = Math.floor(Date.now()/1000);
    const position = now % totalLoop;

    const segment = Math.floor(position / travel);
    const nextStation = stations[segment];
    const timeLeft = travel - (position % travel);

    const minutesEl = document.getElementById("minutes");
    const infoEl = document.getElementById("infoText");

    if(nextStation === currentStation){

        if(timeLeft <= 5){
            minutesEl.innerText = "0";
            minutesEl.classList.add("blink");
            infoEl.innerText = "곧 도착";
        }
        else{
            minutesEl.innerText = "0";
            minutesEl.classList.remove("blink");
            infoEl.innerText = "접근 중 (" + timeLeft + "초)";
        }

    } else {
        const min = Math.ceil(timeLeft/60);
        minutesEl.innerText = min;
        minutesEl.classList.remove("blink");
        infoEl.innerText = nextStation + " → 이동 중";
    }
}

setInterval(updateBoard,1000);
updateBoard();

// ===== 안내문 수동 변경 =====
function changeInfo(){
    const text = prompt("안내문 입력");
    if(text){
        document.getElementById("infoText").innerText = text;
    }
}

</script>

</body>
</html>
