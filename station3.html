<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Paris Metro SIEL - Station</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* 이전 디자인 CSS 동일 */
        body { background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; }
        .siel-board { width: 1000px; height: 450px; background: #000; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; border: 5px solid #1a1a1a; }
        .top-bar { background: #f0f0f0; height: 100px; display: flex; align-items: center; padding: 0 30px; }
        .line-1 { width: 60px; height: 60px; background: #ffbe00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 35px; margin-right: 20px; }
        .station-name { font-size: 50px; font-weight: 900; color: #1a1a1a; }
        .content { display: flex; flex: 1; }
        .time-section { flex: 1.3; padding: 40px; color: #ffeb3b; font-size: 160px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; }
        .divider { width: 5px; height: 120px; background: #fff; opacity: 0.5; }
        .info-section { flex: 1; background: #ffdb00; margin: 15px; border-radius: 5px; padding: 20px; color: #1a1a1a; font-size: 24px; font-weight: bold; }
        .clock { background: #1a1a1a; color: #fff; padding: 5px 10px; float: right; border-radius: 5px; }
        .blink { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }
        .arrive { font-size: 70px; }
    </style>
</head>
<body>

<div class="siel-board">
    <div class="top-bar">
        <div class="line-1">1</div>
        <div class="station-name">STATION 3</div>
    </div>
    <div class="content">
        <div class="time-section">
            <span id="t1">--</span>
            <div class="divider"></div>
            <span id="t2">--</span>
        </div>
        <div class="info-section">
            <div class="clock" id="clock">00:00</div>
            <p id="msg">연결 중...</p>
        </div>
    </div>
</div>

<script>
    const STATION_ID = 's3'; // 역에 따라 s2, s3로 수정

    // [필수] 관제센터와 동일한 Firebase 설정을 넣으세요!
    const firebaseConfig = {
            apiKey: "AIzaSyB0XGb9qUq7K4Z5SVUE6IQsh-UmXwMI25M",
            databaseURL: "https://metro-dfaf8-default-rtdb.firebaseio.com",
            projectId: "metro-dfaf8",
        };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let serverData = null;

    // 데이터베이스 실시간 감시
    db.ref('metroLine1/' + STATION_ID).on('value', (snapshot) => {
        serverData = snapshot.val();
        render();
    });

    function render() {
        if (!serverData) return;
        
        let displayT1 = serverData.t1;
        let displayT2 = serverData.t2;

        if (serverData.mode === 'auto') {
            // 자동 모드: (현재시간 - 전송시간)만큼 분을 뺌
            const diffMs = Date.now() - serverData.updatedAt;
            const diffMin = Math.floor(diffMs / 60000);
            
            displayT1 = Math.max(0, serverData.t1 - diffMin);
            displayT2 = Math.max(1, serverData.t2 - diffMin);
            
            // 만약 1차가 도착했다면 2차 열차를 보여주는 등의 로직은 
            // 실제 운행 패턴에 맞춰 추가 가능합니다.
        }

        const t1El = document.getElementById('t1');
        if (displayT1 <= 0) {
            t1El.innerText = "ARRIVÉE";
            t1El.classList.add('blink', 'arrive');
        } else {
            t1El.innerText = displayT1;
            t1El.classList.remove('blink', 'arrive');
        }
        document.getElementById('t2').innerText = displayT2;
        document.getElementById('msg').innerText = serverData.msg;
    }

    // 시계 및 렌더링 주기 (초 단위로 화면 갱신)
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        render(); // 자동 모드 시간을 실시간으로 갱신
    }, 1000);
</script>
</body>
</html>
