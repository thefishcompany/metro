<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<title>거실역</title>
</head>
<body>

<div class="board">

    <div class="header">
        <div class="line">1호선</div>
        <div class="station">거실역</div>
        <div class="time" id="clock"></div>
    </div>

    <div class="section">
        <div>다음 열차 도착</div>
        <div class="big" id="countdown"></div>
    </div>

    <div class="section">
        <div>구간 이동 시간</div>
        <div id="travelTime"></div>
    </div>

</div>

<script>
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);
updateClock();

function startCountdown(){
    const config = getConfig();
    let interval = config.interval;
    let travel = config.travelTime;

    document.getElementById("travelTime").innerText = travel + "초";

    let timeLeft = interval;

    setInterval(()=>{
        timeLeft--;
        if(timeLeft <= 0){
            timeLeft = interval;
        }
        document.getElementById("countdown").innerText = timeLeft + "초";
    },1000);
}

startCountdown();
</script>

</body>
</html>
