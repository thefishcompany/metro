<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Metro Display</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* 상단 */
.topbar{
    background:#e5e5e5;
    height:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    font-weight:bold;
}

/* 메인 */
.main{
    display:flex;
    height:calc(100vh - 60px);
}

/* 열차 전광판 */
.left{
    flex:2;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.train-wrapper{
    width:500px;
    overflow:hidden;
}

.train-track{
    display:flex;
    transition:transform 0.5s ease;
}

.train{
    width:250px;
    text-align:center;
    font-size:220px;
    font-weight:bold;
    color:#ffc400;
}

/* 오른쪽 안내 */
.right{
    flex:1;
    background:black;
    border-left:2px solid #222;
    color:white;
    padding:40px;
}

.info{
    font-size:28px;
}

/* 컨트롤 패널 */
.control-panel{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#222;
    padding:20px;
    border-radius:10px;
    color:white;
    width:260px;
}

.control-panel input{
    width:100%;
    margin-bottom:10px;
    padding:6px;
}

.control-panel button{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
    <div>🚇 1호선 거실역</div>
    <div id="clock"></div>
</div>

<div class="main">
    <div class="left">
        <div class="train-wrapper">
            <div class="train-track" id="track">
                <div class="train">1</div>
                <div class="train">2</div>
            </div>
        </div>
    </div>

    <div class="right">
        <div class="info" id="infoText">주방 → 이동 중</div>
    </div>
</div>

<div class="control-panel">
    <b>안내문 변경</b>
    <input type="text" id="infoInput" placeholder="안내문 입력">
    <button onclick="changeInfo()">안내 적용</button>

    <b>1번 열차 탑승시간(초)</b>
    <input type="number" id="currentTimeInput" value="10">
    <button onclick="setCurrentTime()">시간 설정</button>

    <b>새 열차 기본시간(초)</b>
    <input type="number" id="nextTimeInput" value="15">
    <button onclick="setNextTime()">기본시간 설정</button>
</div>

<script>
let currentTime = 10;
let defaultNextTime = 15;
let interval;
const track = document.getElementById("track");

/* 시계 */
function updateClock(){
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,'0');
    const p = h >= 12 ? "오후" : "오전";
    const dh = h % 12 || 12;
    document.getElementById("clock").innerText = p+" "+dh+":"+m;
}
setInterval(updateClock,1000);
updateClock();

/* 카운트다운 (표시는 안함) */
function start(){
    clearInterval(interval);
    interval = setInterval(()=>{
        if(currentTime > 0){
            currentTime--;
        }
        if(currentTime === 0){
            slide();
        }
    },1000);
}

/* 슬라이드 */
function slide(){
    clearInterval(interval);
    track.style.transform = "translateX(-250px)";

    setTimeout(()=>{
        currentTime = defaultNextTime;

        track.style.transition = "none";
        track.style.transform = "translateX(0)";

        void track.offsetWidth;
        track.style.transition = "transform 0.5s ease";

        start();
    },500);
}

/* 컨트롤 기능 */
function changeInfo(){
    const text = document.getElementById("infoInput").value;
    if(text.trim() !== ""){
        document.getElementById("infoText").innerText = text;
    }
}

function setCurrentTime(){
    const val = parseInt(document.getElementById("currentTimeInput").value);
    if(!isNaN(val) && val>0){
        currentTime = val;
        start();
    }
}

function setNextTime(){
    const val = parseInt(document.getElementById("nextTimeInput").value);
    if(!isNaN(val) && val>0){
        defaultNextTime = val;
    }
}

start();
</script>

</body>
</html>
