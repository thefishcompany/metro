<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Paris Metro - Station 1</title>
    <style>
        /* 파리 지하철 전광판 스타일 */
        body {
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .station-name {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border: 2px solid white;
            padding: 5px 20px;
        }

        .display-board {
            background-color: #111;
            border: 8px solid #333;
            border-radius: 15px;
            padding: 30px;
            width: 500px;
            box-shadow: inset 0 0 20px #000;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #444;
        }

        .row:last-child { border-bottom: none; }

        .destination {
            color: #ff9d00; /* 파리 지하철 특유의 오렌지색 */
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.7);
        }

        .time {
            color: #ff9d00;
            font-size: 2.2rem;
        }

        /* 1분 미만일 때 깜빡이는 효과 */
        .blink {
            animation: blink-animation 1s steps(5, start) infinite;
        }

        @keyframes blink-animation {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="station-name">STATION 1</div>

    <div class="display-board">
        <div class="row">
            <span class="destination" id="dest1">LOADING...</span>
            <span class="time" id="time1">-- min</span>
        </div>
        <div class="row">
            <span class="destination" id="dest2">LOADING...</span>
            <span class="time" id="time2">-- min</span>
        </div>
    </div>

    <script>
        const STATION_ID = 's1'; // station2는 's2', station3은 's3'로 수정

        function updateDisplay() {
            const data = JSON.parse(localStorage.getItem('metroData') || '{}');
            const myStation = data[STATION_ID];

            if (myStation) {
                document.getElementById('dest1').innerText = myStation.dest1;
                document.getElementById('dest2').innerText = myStation.dest2;
                
                // 시간 표시 및 0분일 때 깜빡임 처리
                const t1 = myStation.time1;
                const t2 = myStation.time2;
                
                document.getElementById('time1').innerText = t1 <= 0 ? "ARRIVÉE" : t1 + " min";
                document.getElementById('time1').className = t1 <= 0 ? "time blink" : "time";
                
                document.getElementById('time2').innerText = t2 <= 0 ? "ARRIVÉE" : t2 + " min";
                document.getElementById('time2').className = t2 <= 0 ? "time blink" : "time";
            }
        }

        window.addEventListener('storage', updateDisplay);
        updateDisplay();
    </script>
</body>
</html>
