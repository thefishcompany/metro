<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Metro Display</title>

<style>
body {
    margin: 0;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* 상단 */
.topbar {
    background: #e5e5e5;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    font-weight: bold;
}

/* 메인 */
.main {
    display: flex;
    height: calc(100vh - 60px);
}

/* 열차 영역 */
.left {
    flex: 2;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

.train-container {
    display: flex;
    transition: transform 0.6s ease-in-out;
}

.train {
    color: #ffc400;
    font-size: 200px;
    font-weight: bold;
    width: 250px;
    text-align: center;
}

/* 오른쪽 안내 */
.right {
    flex: 1;
    background: black;
    color: white;
    padding: 40px;
    box-sizing: border-box;
    border-left: 2px solid #222;
}

.info {
    font-size: 28px;
}

/* 제어 패널 */
.control-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
    color: white;
}

.control-panel input {
    padding: 6px;
    width: 80px;
}

.control-panel button {
    padding: 6px 10px;
    margin-left: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">
    <div>🚇 1호선 거실역</div>
    <div id="clock"></div>
</div>

<div class="main">
    <div class="left">
        <div class="train-container" id="trainContainer">
            <div class="train" id="train1">10</div>
            <div class="train" id="train2">5</div>
        </div>
    </div>

    <div class="right">
        <div class="info">주방 → 이동 중</div>
    </div>
</div>

<div class="control-panel">
    탑승 시간(초):
    <input type="number" id="timeInput" value="10">
    <button onclick="setTime()">설정</button>
</div>

<script>
let trainTimes = [10, 5];
let interval;

/* 시계 */
function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2, '0');
    const p = h >= 12 ? "오후" : "오전";
    const dh = h % 12 || 12;
    document.getElementById("clock").innerText = p + " " + dh + ":" + m;
}
setInterval(updateClock, 1000);
updateClock();

/* 열차 표시 업데이트 */
function renderTrains() {
    document.getElementById("train1").innerText = trainTimes[0];
    document.getElementById("train2").innerText = trainTimes[1];
}

/* 카운트 시작 */
function startCountdown() {
    clearInterval(interval);
    interval = setInterval(() => {
        trainTimes[0]--;
        if (trainTimes[0] <= 0) {
            slideTrains();
        }
        renderTrains();
    }, 1000);
}

/* 슬라이드 효과 */
function slideTrains() {
    const container = document.getElementById("trainContainer");
    container.style.transform = "translateX(-250px)";

    setTimeout(() => {
        container.style.transition = "none";
        container.style.transform = "translateX(0)";

        trainTimes.shift(); // 앞 제거
        trainTimes.push(Math.floor(Math.random() * 10) + 5); // 새 시간 추가

        renderTrains();

        void container.offsetWidth;
        container.style.transition = "transform 0.6s ease-in-out";
    }, 600);
}

/* 제어 패널 시간 변경 */
function setTime() {
    const newTime = parseInt(document.getElementById("timeInput").value);
    if (!isNaN(newTime) && newTime > 0) {
        trainTimes[0] = newTime;
        renderTrains();
    }
}

renderTrains();
startCountdown();
</script>

</body>
</html>
