<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>운영자</title>
<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{ width:400px; }
input{
    width:100%;
    padding:15px;
    margin:10px 0;
    background:#111;
    color:#fff;
    border:1px solid #444;
}
button{
    width:100%;
    padding:15px;
}
</style>
</head>
<body>

<div class="box">
<h2>이동시간 설정 (초)</h2>
<input type="number" id="travel">
<button onclick="save()">저장</button>
</div>

<script>
if (!localStorage.getItem("metroConfig")) {
    localStorage.setItem("metroConfig", JSON.stringify({
        travelTime: 35
    }));
}

const config = JSON.parse(localStorage.getItem("metroConfig"));
document.getElementById("travel").value = config.travelTime;

function save(){
    const travel = parseInt(document.getElementById("travel").value);
    localStorage.setItem("metroConfig", JSON.stringify({
        travelTime: travel
    }));
    alert("변경 완료");
}
</script>

</body>
</html>
