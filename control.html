<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>운영자 모드</title>
<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    width:500px;
}
h2{
    border-bottom:2px solid #444;
    padding-bottom:10px;
}
input{
    width:100%;
    padding:15px;
    margin:10px 0;
    background:#111;
    color:#fff;
    border:1px solid #444;
    font-size:18px;
}
button{
    width:100%;
    padding:15px;
    background:#fff;
    color:#000;
    border:none;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>운영자 설정</h2>

<label>배차 간격 (초)</label>
<input type="number" id="interval">

<label>이동 시간 (초)</label>
<input type="number" id="travel">

<button onclick="save()">저장</button>
</div>

<script>
if (!localStorage.getItem("metroConfig")) {
    localStorage.setItem("metroConfig", JSON.stringify({
        interval: 180,
        travelTime: 35
    }));
}

function getConfig(){
    return JSON.parse(localStorage.getItem("metroConfig"));
}

function save(){
    const newConfig = {
        interval: parseInt(document.getElementById("interval").value),
        travelTime: parseInt(document.getElementById("travel").value)
    };
    localStorage.setItem("metroConfig", JSON.stringify(newConfig));
    alert("설정이 변경되었습니다.");
}

const config = getConfig();
document.getElementById("interval").value = config.interval;
document.getElementById("travel").value = config.travelTime;
</script>

</body>
</html>
