<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<title>운영자 모드</title>
</head>
<body>

<div class="board">

    <div class="line">운영자 설정</div>
    <br>

    <div class="section">
        <div>열차 간격 (초)</div>
        <input type="number" id="interval">
    </div>

    <div class="section">
        <div>구간 이동 시간 (초)</div>
        <input type="number" id="travel">
    </div>

    <br>
    <button onclick="save()">저장</button>

</div>

<script>
function load(){
    const config = getConfig();
    document.getElementById("interval").value = config.interval;
    document.getElementById("travel").value = config.travelTime;
}

function save(){
    const newConfig = {
        interval: parseInt(document.getElementById("interval").value),
        travelTime: parseInt(document.getElementById("travel").value)
    };
    setConfig(newConfig);
    alert("설정이 변경되었습니다.");
}

load();
</script>

</body>
</html>
