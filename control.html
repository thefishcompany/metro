<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Metro SIEL Cloud Controller</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 12px; border-top: 10px solid #ffbe00; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .mode-sel { background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        textarea { width: 95%; height: 50px; }
        input[type="number"] { width: 50px; }
        button { width: 100%; padding: 20px; background: #1a1a1a; color: #ffbe00; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; border: none; }
    </style>
</head>
<body>
    <h1>🚇 Ligne 1 - 클라우드 관제실</h1>
    <div class="grid" id="grid"></div>
    <button onclick="publish()">전 노선 업데이트 송출 (Firebase)</button>

    <script>
        // [필수] 본인의 Firebase 설정으로 교체하세요!
        const firebaseConfig = {
            apiKey: "AIzaSyB0XGb9qUq7K4Z5SVUE6IQsh-UmXwMI25M",
            databaseURL: "https://metro-dfaf8-default-rtdb.firebaseio.com",
            projectId: "metro-dfaf8",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        for(let i=1; i<=3; i++) {
            document.getElementById('grid').innerHTML += `
                <div class="card">
                    <h3>역 ${i}</h3>
                    <div class="mode-sel">
                        <label><input type="radio" name="m${i}" value="manual" checked> 수동</label>
                        <label><input type="radio" name="m${i}" value="auto"> 자동</label>
                    </div>
                    <p>1차: <input type="number" id="s${i}t1" value="2">분 | 2차: <input type="number" id="s${i}t2" value="7">분</p>
                    <textarea id="s${i}msg">Trafic normal.</textarea>
                </div>
            `;
        }

        function publish() {
            const data = {};
            const now = Date.now();
            for(let i=1; i<=3; i++) {
                const mode = document.querySelector(`input[name="m${i}"]:checked`).value;
                data['s'+i] = {
                    mode: mode,
                    t1: parseInt(document.getElementById(`s${i}t1`).value),
                    t2: parseInt(document.getElementById(`s${i}t2`).value),
                    msg: document.getElementById(`s${i}msg`).value,
                    updatedAt: now // 자동 모드 계산을 위한 기준 시간
                };
            }
            db.ref('metroLine1').set(data).then(() => alert("클라우드 전송 완료!"));
        }
    </script>
</body>
</html>
